services:
  postgres:
    image: postgres:18.6
    container_name: amazon-reviews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in the env file}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${AMZDATA_POSTGRES_DATA_DIR:?AMZDATA_POSTGRES_DATA_DIR must be set in the env file}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
